[package]
name = "pcs"
version = "0.1.3"
edition = "2024"
rust-version = "1.87"
publish = false

[dependencies]
anyhow = "1.0.104"
thiserror = "2"
clap = { version = "4.5.45", features = ["derive"] }
ratatui = "0.30"
rfd = { version = "0.17.2", default-features = false, features = ["pollster"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Console",
    "Win32_System_Time",
    "Win32_Security_Cryptography",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_Foundation",
] }

[dev-dependencies]
assert_cmd = "2"

[profile.release]
lto = true
strip = true
