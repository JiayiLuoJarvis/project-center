[package]
name = "pcs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.45", features = ["derive"] }
ratatui = "0.30"
rfd = { version = "0.17.2", default-features = false, features = ["pollster"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Time"] }

[profile.release]
lto = true
strip = true
